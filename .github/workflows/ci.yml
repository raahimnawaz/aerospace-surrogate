name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Type-check
        run: mypy

      - name: Test (Python solver only; Rust parity tests skip if wheel absent)
        run: pytest -q

  rust:
    name: Rust (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}

      - name: Cargo test (workspace default members)
        working-directory: rust
        run: cargo test --workspace --verbose

      - name: Cargo build (release, all members)
        working-directory: rust
        run: cargo build --workspace --release

  rust-python-parity:
    name: Rust ↔ Python parity (maturin)
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python project + maturin
        run: |
          python -m pip install --upgrade pip maturin
          pip install -e ".[dev]"

      - name: Build + install Rust wheel
        run: |
          maturin build --release --manifest-path rust/aerosurrogate-py/Cargo.toml --out dist
          pip install --force-reinstall dist/*.whl

      - name: Run Python ↔ Rust parity tests
        run: pytest -q tests/test_rust_parity.py

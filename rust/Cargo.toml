[workspace]
resolver = "2"
members = [
    "aerosurrogate-core",
    "aerosurrogate-py",
]
# Plain `cargo build` / `cargo test` from the workspace root builds only the
# pure-Rust core crate. The PyO3 wrapper crate links against the embedding
# Python interpreter symbols and is only meaningful when built through
# maturin from inside `aerosurrogate-py/`.
default-members = ["aerosurrogate-core"]

[workspace.package]
version = "0.1.0"
authors = ["Raahim Nawaz"]
edition = "2021"
license = "MIT"
repository = "https://github.com/raahimnawaz/aerospace-surrogate"
rust-version = "1.75"

[workspace.dependencies]
nalgebra = "0.33"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
approx = "0.5"
criterion = { version = "0.5", default-features = false, features = ["plotters"] }
pyo3 = { version = "0.22", features = ["abi3-py310"] }
numpy = "0.22"

# Release profile tuned for the LLT inner loops:
# - LTO catches the cross-crate inlining the surrogate code wants
# - codegen-units=1 trades compile time for tighter scheduling
# - panic=abort shrinks binary; LLT errors are typed Result anyway
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "debuginfo"

# bench profile mirrors release but keeps debug info for flamegraphs
[profile.bench]
inherits = "release"
debug = true
strip = "none"

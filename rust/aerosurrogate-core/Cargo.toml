[package]
name = "aerosurrogate-core"
description = "Nonlinear lifting-line theory solver for finite wings, with baked-in sklearn airfoil surrogates"
keywords = ["aerodynamics", "aerospace", "lifting-line", "airfoil"]
categories = ["science", "simulation", "mathematics"]
readme = "../README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nalgebra = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = []
# Enable Serde derives on result/option structs; off by default so the core
# crate has only nalgebra+thiserror in its dependency tree.
serde = ["dep:serde", "nalgebra/serde-serialize"]

[[bench]]
name = "solver"
harness = false
